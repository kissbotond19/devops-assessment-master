apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: myapp
  namespace: {{ .Values.namespace }}

spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:  
          - path: /
            pathType: Prefix
            
            backend:
              service:
                name: myapp
                port:
                  number: {{ .Values.service.port }}